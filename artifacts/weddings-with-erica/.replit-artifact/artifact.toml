kind = "web"
previewPath = "/"
title = "Weddings with Erica"
version = "1.0.0"
id = "artifacts/weddings-with-erica"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23887

[services.development]
run = "pnpm --filter @workspace/weddings-with-erica run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weddings-with-erica", "run", "build" ]
publicDir = "artifacts/weddings-with-erica/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23887"
BASE_PATH = "/"
