<!DOCTYPE html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Primary SEO -->
    <title>Wedding Planner Ireland | Weddings with Erica</title>
    <meta name="description" content="Calm, personal wedding planning and day-of coordination across Ireland. Erica Egan helps couples plan with confidence and enjoy every moment." />
    <meta name="author" content="Erica Egan — Weddings with Erica" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://weddingswitherica.com/" />
    <meta name="theme-color" content="#6e7f58" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Weddings with Erica" />
    <meta property="og:url" content="https://weddingswitherica.com/" />
    <meta property="og:title" content="Wedding Planner Ireland | Weddings with Erica" />
    <meta property="og:description" content="Calm, personal wedding planning and coordination from Erica Egan, helping you stay organised and fully present on your day." />
    <meta property="og:image" content="https://weddingswitherica.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Weddings with Erica — wedding planning and coordination in Ireland" />
    <meta property="og:locale" content="en_IE" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@weddingswitherica" />
    <meta name="twitter:title" content="Wedding Planner Ireland | Weddings with Erica" />
    <meta name="twitter:description" content="Calm, personal wedding planning and coordination from Erica Egan, helping you stay organised and fully present on your day." />
    <meta name="twitter:image" content="https://weddingswitherica.com/opengraph.jpg" />

    <!-- Geo / Local -->
    <meta name="geo.region" content="IE" />
    <meta name="geo.placename" content="Ireland" />

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "@id": "https://weddingswitherica.com/#business",
      "additionalType": "https://schema.org/EventPlanner",
      "name": "Weddings with Erica",
      "description": "Wedding planning and coordination services including full planning, partial planning support, signature day coordination, and planning power hours.",
      "url": "https://weddingswitherica.com",
      "logo": "https://weddingswitherica.com/favicon.png",
      "image": "https://weddingswitherica.com/opengraph.jpg",
      "email": "wedwitherica@gmail.com",
      "telephone": "+353872186100",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IE"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Ireland"
      },
      "founder": {
        "@type": "Person",
        "name": "Erica Egan"
      },
      "sameAs": [
        "https://www.instagram.com/weddingswitherica/",
        "https://www.tiktok.com/@weddingswitherica"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Wedding Planning Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Signature Day Coordination",
              "description": "Comprehensive on-the-day wedding coordination so you can enjoy every moment."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Partial Planning Support",
              "description": "Expert guidance at key stages of your wedding planning journey."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Full Planning + Coordination",
              "description": "Complete end-to-end wedding planning and on-the-day coordination."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Planning Power Hour",
              "description": "A focused one-hour strategy session to get your planning back on track."
            }
          }
        ]
      }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="15x15" href="/favicon.png" />
    <link rel="alternate" hreflang="en-ie" href="https://weddingswitherica.com/" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Netlify detects forms from static HTML at deploy time. The visible React form submits to this form name. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="partnerName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="date" />
      <input type="text" name="venue" />
      <input type="text" name="service" />
      <input type="text" name="howHeard" />
      <textarea name="details"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
