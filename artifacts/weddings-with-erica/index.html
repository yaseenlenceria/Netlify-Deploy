    <meta property="og:type" content="website" />

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "additionalType": "https://schema.org/EventPlanner",
      "name": "Weddings with Erica",
      "description": "Ireland's boutique wedding planner offering full planning & coordination, partial planning support, signature day coordination, and planning power hours.",
      "url": "https://weddingswitherica.ie",
      "logo": "https://weddingswitherica.ie/logo.png",
      "image": "https://weddingswitherica.ie/opengraph.jpg",
      "email": "wedwitherica@gmail.com",
      "telephone": "+353872186100",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IE"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Ireland"
      },
      "founder": {
        "@type": "Person",
        "name": "Erica Egan"
      },
      "sameAs": [
        "https://www.instagram.com/weddingswitherica/",
        "https://www.tiktok.com/@weddingswitherica"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Wedding Planning Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Signature Day Coordination",
              "description": "Comprehensive on-the-day wedding coordination so you can enjoy every moment."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Partial Planning Support",
              "description": "Expert guidance at key stages of your wedding planning journey."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Full Planning + Coordination",
              "description": "Complete end-to-end wedding planning and on-the-day coordination."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Planning Power Hour",
              "description": "A focused one-hour strategy session to get your planning back on track."
            }
          }
        ]
      }
    }
    </script>
