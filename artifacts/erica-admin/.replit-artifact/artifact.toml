kind = "mobile"
previewPath = "/erica-admin/"
title = "Erica's Enquiry Inbox"
version = "1.0.0"
id = "artifacts/erica-admin"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/erica-admin/" ]
localPort = 24178

[services.development]
run = "pnpm --filter @workspace/erica-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/erica-admin", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/erica-admin", "run", "serve" ]

[services.env]
PORT = "24178"
BASE_PATH = "/erica-admin/"
