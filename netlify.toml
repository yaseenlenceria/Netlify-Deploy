[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/weddings-with-erica build"
  publish = "artifacts/weddings-with-erica/dist/public"

[build.environment]
  BASE_PATH = "/"
  NPM_FLAGS = "--prefix=/"
  NODE_VERSION = "22"
  PNPM_VERSION = "11.7.0"
  PORT = "8080"

[[redirects]]
  from = "https://www.weddingswitherica.com/*"
  to = "https://weddingswitherica.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/wedding-planner-olivia"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
